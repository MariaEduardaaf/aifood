# Fly.io configuration. See docs/DEPLOY.md.
app = "aifood-app"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[build.args]
  # Baked into the client bundle; used by table QR codes
  NEXT_PUBLIC_APP_URL = "https://aifood-app.fly.dev"
  NEXT_PUBLIC_SHOW_DEMO_LOGINS = "false"

[env]
  PORT = "3000"
  AUTH_URL = "https://aifood-app.fly.dev"
  NEXT_PUBLIC_APP_URL = "https://aifood-app.fly.dev"
  UPLOAD_DIR = "/app/uploads"

# Menu photos (local storage); the volume keeps them across deploys
[mounts]
  source = "aifood_uploads"
  destination = "/app/uploads"

[http_service]
  internal_port = 3000
  force_https = true
  # Staff screens keep SSE connections open; never stop the machine
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

# Realtime uses an in-process event bus: keep exactly one machine
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
